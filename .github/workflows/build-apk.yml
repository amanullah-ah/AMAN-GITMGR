name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html logo.png favicon.png apple-touch-icon.png www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create Android project
        run: |
          npx cap init "AMAN GITMGR" com.aman.gitmgr --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Set APK icon from logo.png
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os, shutil
          res = 'android/app/src/main/res'
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          logo = Image.open('logo.png').convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, s in sizes.items():
              folder = f'{res}/mipmap-{d}'
              os.makedirs(folder, exist_ok=True)
              icon = logo.resize((s, s), Image.LANCZOS)
              for name in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                  icon.save(f'{folder}/{name}')
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AMAN-GITMGR.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMAN-GITMGR-APK
          path: AMAN-GITMGR.apk
